# CommerceMind 最小运行环境
# 只启动当前已实现的 app；Redis、ChromaDB、Nginx、Prometheus 等尚未接入，暂不编排。

services:
  commercemind:
    build:
      context: .
      target: production
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: commercemind:local
    container_name: commercemind-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
